<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System — Single-File Edition</title>
</head>
<body>
<main id="app"></main>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const app = document.getElementById("app");

  const style = document.createElement("style");
  style.textContent = `
    * {
      box-sizing: border-box;
    }

    :root {
      --text-main: #f9fafb;
      --text-soft: #cbd5e1;
      --orbit-line: rgba(255, 255, 255, 0.14);
      --card-bg: rgba(15, 23, 42, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --scene-size: min(92vw, 920px);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-main);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,0.14) 0 1px, transparent 1px),
        radial-gradient(circle at 78% 22%, rgba(255,255,255,0.16) 0 1px, transparent 1px),
        radial-gradient(circle at 84% 76%, rgba(255,255,255,0.12) 0 1px, transparent 1px),
        radial-gradient(circle at 24% 76%, rgba(255,255,255,0.10) 0 1px, transparent 1px),
        radial-gradient(circle at center, #0f1b3d 0%, #070d1f 45%, #030712 100%);
      background-size: 140px 140px, 180px 180px, 220px 220px, 260px 260px, auto;
      overflow-x: hidden;
    }

    .page {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .page h1 {
      text-align: center;
      margin: 8px 0 10px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.03em;
    }

    .subtitle,
    .note {
      text-align: center;
      color: var(--text-soft);
      margin: 0 auto;
      max-width: 760px;
      line-height: 1.6;
    }

    .note {
      font-size: 0.95rem;
      margin-top: 10px;
      margin-bottom: 18px;
    }

    .scene-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 12px;
      margin-bottom: 28px;
    }

    .scene {
      position: relative;
      width: var(--scene-size);
      height: var(--scene-size);
      max-width: 920px;
      max-height: 920px;
      min-width: 320px;
      min-height: 320px;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 24%, rgba(0,0,0,0) 48%),
        radial-gradient(circle at center, rgba(251, 191, 36, 0.08) 0%, rgba(0,0,0,0) 58%);
      box-shadow:
        inset 0 0 80px rgba(255, 255, 255, 0.03),
        0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,0.3) 0 1px, transparent 1px),
        radial-gradient(circle at 18% 28%, rgba(255,255,255,0.3) 0 1px, transparent 1px),
        radial-gradient(circle at 82% 18%, rgba(255,255,255,0.25) 0 1px, transparent 1px),
        radial-gradient(circle at 72% 78%, rgba(255,255,255,0.28) 0 1px, transparent 1px),
        radial-gradient(circle at 42% 86%, rgba(255,255,255,0.20) 0 1px, transparent 1px),
        radial-gradient(circle at 58% 32%, rgba(255,255,255,0.18) 0 1px, transparent 1px);
      background-size: 100% 100%;
      pointer-events: none;
      opacity: 0.85;
    }

    .sun {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100px;
      height: 100px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #fff6bf 0%, #ffe27a 22%, #fbbf24 55%, #f59e0b 78%, #c2410c 100%);
      box-shadow:
        0 0 25px rgba(251, 191, 36, 0.95),
        0 0 55px rgba(251, 191, 36, 0.65),
        0 0 110px rgba(249, 115, 22, 0.30);
      z-index: 20;
    }

    .sun-label {
      position: absolute;
      left: 50%;
      top: calc(50% + 72px);
      transform: translateX(-50%);
      color: #ffe9a8;
      font-weight: bold;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.55);
      z-index: 22;
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--orbit-size);
      height: var(--orbit-size);
      transform: translate(-50%, -50%);
      border: 1px solid var(--orbit-line);
      border-radius: 50%;
      z-index: 2;
    }

    .orbit::before {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.04);
    }

    .planet-anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--orbit-size) / 2);
      height: 0;
      transform-origin: 0 0;
      transform: rotate(var(--angle));
      z-index: 10;
    }

    .planet-card {
      position: absolute;
      right: 0;
      top: 0;
      transform: translate(50%, -50%) rotate(calc(var(--angle) * -1));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .planet {
      position: relative;
      width: var(--planet-size);
      height: var(--planet-size);
      border-radius: 50%;
      background: var(--planet-bg);
      box-shadow:
        inset -10px -10px 18px rgba(0,0,0,0.35),
        inset 8px 8px 14px rgba(255,255,255,0.08),
        0 0 22px rgba(255,255,255,0.10);
      transition: transform 0.25s ease;
      overflow: visible;
    }

    .planet:hover {
      transform: scale(1.08);
    }

    .planet::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.10) 20%, transparent 34%);
      pointer-events: none;
    }

    .planet.saturn::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--planet-size) * 1.9);
      height: calc(var(--planet-size) * 0.48);
      transform: translate(-50%, -50%) rotate(-18deg);
      border-radius: 50%;
      border: 5px solid rgba(232, 203, 128, 0.72);
      box-shadow: 0 0 10px rgba(232, 203, 128, 0.18);
      z-index: -1;
    }

    .moon-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f8fafc 0%, #cbd5e1 50%, #94a3b8 100%);
      box-shadow: 0 0 6px rgba(255,255,255,0.55);
    }

    .planet-label {
      text-align: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(6px);
      font-size: 0.82rem;
      line-height: 1.35;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
    }

    .planet-label strong {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 1px;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .legend-item {
      background: rgba(15, 23, 42, 0.62);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--text-soft);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .legend-item strong {
      color: var(--text-main);
      display: block;
      margin-bottom: 4px;
    }

    @media (max-width: 700px) {
      .sun {
        width: 72px;
        height: 72px;
      }

      .sun-label {
        top: calc(50% + 54px);
        font-size: 0.82rem;
      }

      .planet-label {
        font-size: 0.72rem;
        padding: 5px 8px;
      }

      .planet-label strong {
        font-size: 0.8rem;
      }
    }
  `;
  document.head.appendChild(style);

  const planets = [
    {
      name: "Mercury",
      orbitSize: 170,
      size: 18,
      angle: 18,
      moons: 0,
      texture: "radial-gradient(circle at 30% 30%, #ddd6cc 0%, #b8aea2 34%, #8d8379 62%, #55514d 100%)"
    },
    {
      name: "Venus",
      orbitSize: 235,
      size: 26,
      angle: 122,
      moons: 0,
      texture: "linear-gradient(135deg, #8b5e1a 0%, #c78a2a 20%, #f2c261 45%, #d58b2f 68%, #9c5f16 100%)"
    },
    {
      name: "Earth",
      orbitSize: 310,
      size: 28,
      angle: 220,
      moons: 1,
      texture: "radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 24%), radial-gradient(circle at 62% 40%, #46a758 0%, #46a758 16%, transparent 17%), radial-gradient(circle at 42% 66%, #2f855a 0%, #2f855a 18%, transparent 19%), radial-gradient(circle at 76% 66%, #65a30d 0%, #65a30d 12%, transparent 13%), linear-gradient(145deg, #63b3ed 0%, #2563eb 50%, #1d4ed8 100%)"
    },
    {
      name: "Mars",
      orbitSize: 390,
      size: 23,
      angle: 320,
      moons: 2,
      texture: "radial-gradient(circle at 34% 34%, #f4b18a 0%, #c96d42 30%, #a33c1c 65%, #6f1d12 100%)"
    },
    {
      name: "Jupiter",
      orbitSize: 500,
      size: 46,
      angle: 70,
      moons: 4,
      texture: "linear-gradient(180deg, #eac29c 0%, #c98b5b 16%, #efd3af 31%, #b96a39 48%, #f0d8b6 64%, #9a5b34 80%, #d9ad82 100%)"
    },
    {
      name: "Saturn",
      orbitSize: 610,
      size: 40,
      angle: 176,
      moons: 6,
      className: "saturn",
      texture: "linear-gradient(180deg, #f4dc95 0%, #ddbe73 24%, #c9a451 50%, #f0d99d 72%, #bb9250 100%)"
    },
    {
      name: "Uranus",
      orbitSize: 730,
      size: 34,
      angle: 256,
      moons: 5,
      texture: "linear-gradient(145deg, #d4fbff 0%, #8be8f8 35%, #5bd4f2 65%, #4bb0cf 100%)"
    },
    {
      name: "Neptune",
      orbitSize: 840,
      size: 33,
      angle: 18,
      moons: 2,
      texture: "linear-gradient(145deg, #76a8ff 0%, #2563eb 38%, #1d4ed8 72%, #172554 100%)"
    }
  ];

  const page = document.createElement("div");
  page.className = "page";

  page.innerHTML = `
    <h1>The Solar System</h1>
    <p class="subtitle">A more polished, stylized view of the planets with richer textures and visible orbits.</p>
    <p class="note">This illustration is intentionally <strong>not to scale</strong>. It focuses on appearance, orbit placement, and readability rather than scientific proportions.</p>
    <div class="scene-wrapper">
      <div class="scene" id="scene"></div>
    </div>
    <div class="legend">
      <div class="legend-item"><strong>Improved appearance</strong>Each planet uses layered gradients to suggest the colors and surface character of the real planet.</div>
      <div class="legend-item"><strong>Planets on orbit lines</strong>The planets are placed on visible circular orbits around the Sun for a clearer solar-system layout.</div>
      <div class="legend-item"><strong>Still simple enough for class</strong>The whole project is built only with HTML, CSS, JavaScript, loops, arrays, and DOM creation.</div>
    </div>
  `;

  app.appendChild(page);

  const scene = document.getElementById("scene");

  const sun = document.createElement("div");
  sun.className = "sun";
  scene.appendChild(sun);

  const sunLabel = document.createElement("div");
  sunLabel.className = "sun-label";
  sunLabel.textContent = "Sun";
  scene.appendChild(sunLabel);

  planets.forEach((planet) => {
    const orbit = document.createElement("div");
    orbit.className = "orbit";
    orbit.style.setProperty("--orbit-size", `${planet.orbitSize}px`);

    const anchor = document.createElement("div");
    anchor.className = "planet-anchor";
    anchor.style.setProperty("--angle", `${planet.angle}deg`);

    const card = document.createElement("div");
    card.className = "planet-card";
    card.style.setProperty("--angle", `${planet.angle}deg`);

    const planetDiv = document.createElement("div");
    planetDiv.className = "planet";
    if (planet.className) {
      planetDiv.classList.add(planet.className);
    }
    planetDiv.style.setProperty("--planet-size", `${planet.size}px`);
    planetDiv.style.setProperty("--planet-bg", planet.texture);

    if (planet.moons > 0) {
      for (let i = 0; i < planet.moons; i++) {
        const moon = document.createElement("span");
        moon.className = "moon-dot";

        const moonOrbitRadius = planet.size / 2 + 12;
        const angle = (360 / planet.moons) * i;
        const radians = angle * (Math.PI / 180);
        const x = Math.cos(radians) * moonOrbitRadius;
        const y = Math.sin(radians) * moonOrbitRadius;

        moon.style.left = `calc(50% + ${x}px - 4px)`;
        moon.style.top = `calc(50% + ${y}px - 4px)`;

        planetDiv.appendChild(moon);
      }
    }

    const label = document.createElement("div");
    label.className = "planet-label";
    label.innerHTML = `<strong>${planet.name}</strong>${planet.moons} moon${planet.moons === 1 ? "" : "s"}`;

    card.appendChild(planetDiv);
    card.appendChild(label);
    anchor.appendChild(card);
    orbit.appendChild(anchor);
    scene.appendChild(orbit);
  });
});

</script>
</body>
</html>
